vrrp_script check_nginx {
        script "/usr/local/bin/check_nginx.sh"
        interval 3
}

vrrp_instance VI_1 {
        state BACKUP
        interface ens3
        virtual_router_id 15
        priority 100
        advert_int 1

        virtual_ipaddress {
              192.168.122.200/24
        }

        track_script {
              check_nginx
        }
}