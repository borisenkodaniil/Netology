services:
  db_users:
    image: mysql:8.4
    container_name: db_users
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: users_db
    ports:
      - "3310:3306"

  db_books:
    image: mysql:8.4
    container_name: db_books
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: books_db
    ports:
      - "3311:3306"

  db_stores:
    image: mysql:8.4
    container_name: db_stores
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: stores_db
    ports:
      - "3312:3306"