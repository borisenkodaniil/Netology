server {
    listen 80;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        return 200 "Welcome to nginx!\n";
    }

    location /test {
        return 200 "test page\n";
    }

    location /admin {
        return 404 "not found\n";
    }
}
